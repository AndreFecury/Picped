# Picped - pipeline do GitHub Actions (espelha o .gitlab-ci.yml)
#   lint  -> ruff
#   test  -> pytest contra um PostgreSQL 16 de verdade
#   build -> imagem Docker final (multi-stage) rodando como usuário não-root
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .

  test:
    name: Testes (pytest + PostgreSQL 16)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: picped_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: picped
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: picped
      DB_USER: postgres
      DB_PASSWORD: picped
      TEST_DB_NAME: picped_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v --junitxml=report.xml
      # E2E local: sobe a API de verdade (como no Render) e testa cada funcionalidade por HTTP
      - name: Prepara banco limpo para o E2E
        run: |
          python -c "import psycopg; c=psycopg.connect(host='localhost', user='postgres', password='picped', dbname='picped_test', autocommit=True); c.execute('CREATE DATABASE picped_e2e')"
          python -m app.init_db
        env:
          DATABASE_URL: postgresql://postgres:picped@localhost:5432/picped_e2e
      - name: Sobe a API e roda o E2E
        env:
          DATABASE_URL: postgresql://postgres:picped@localhost:5432/picped_e2e
          GIT_COMMIT: ${{ github.sha }}
        run: |
          uvicorn app.main:app --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          pytest tests_e2e -v --junitxml=report-e2e.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-testes
          path: |
            report.xml
            report-e2e.xml
            uvicorn.log

  build:
    name: Build Docker (não-root)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runtime -t picped-api:ci .
      - name: imagem roda como UID 10001
        run: test "$(docker run --rm --entrypoint id picped-api:ci -u)" = "10001"
      - name: aplicação importa
        run: docker run --rm --entrypoint python picped-api:ci -c "import app.main; print('import ok')"
