# =====================================================================
# Picped - orquestração PostgreSQL + API
#   docker compose up -d --build      -> sobe tudo
#   docker compose ps                 -> status/healthcheck
#   docker compose down               -> para (dados ficam no volume)
#   docker compose down -v            -> para e APAGA o banco (recria com schema+seed)
#   docker compose --profile test run --rm tests  -> roda os testes (banco picped_test)
# =====================================================================
name: picped

services:
  db:
    image: postgres:16-alpine
    container_name: picped-compose-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-picped}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      TZ: America/Manaus
      PGTZ: America/Manaus
    volumes:
      - picped_pgdata:/var/lib/postgresql/data          # volume nomeado persistente
      # executados só na 1ª inicialização (volume vazio), em ordem alfabética
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./scripts/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./scripts/demo.sql:/docker-entrypoint-initdb.d/03-demo.sql:ro   # dados extras do app (demonstrativos)
    networks:
      - backend                                          # banco só é acessível pela rede interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: picped-api:latest
    container_name: picped-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db            # nome do serviço na rede do compose (sobrescreve o localhost do .env)
      DB_PORT: "5432"
      TZ: America/Manaus
    depends_on:
      db:
        condition: service_healthy   # API só inicia depois do pg_isready responder
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - backend
      - frontend
    read_only: true                  # sistema de arquivos do container somente leitura
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  tests:
    profiles: ["test"]               # só sobe com --profile test
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    image: picped-api:test
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      TEST_DB_NAME: picped_test      # banco separado: os testes recriam as tabelas a cada teste
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    name: picped_backend
    driver: bridge
    internal: true                   # rede isolada: sem acesso externo, só db <-> api
  frontend:
    name: picped_frontend
    driver: bridge                   # expõe apenas a API para o host

volumes:
  picped_pgdata:
    name: picped_pgdata
