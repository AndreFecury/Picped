# =====================================================================
# Picped - pipeline GitLab CI
#   lint  -> ruff
#   test  -> pytest contra um PostgreSQL 16 de verdade (serviço postgres:16-alpine)
#   build -> docker build da imagem final (multi-stage, não-root)
# =====================================================================

stages:
  - lint
  - test
  - build

# roda em push de branch e em merge request, sem pipeline duplicado
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

.python:
  image: python:3.12-slim
  cache:
    key: pip-$CI_JOB_NAME
    paths:
      - .cache/pip

lint:
  stage: lint
  extends: .python
  script:
    - pip install "ruff>=0.6"
    - ruff --version
    - ruff check .

test:
  stage: test
  extends: .python
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    # usadas pelo serviço postgres
    POSTGRES_DB: picped_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: picped
    # usadas pela API/testes (app/core/config.py e tests/conftest.py)
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: picped
    DB_USER: postgres
    DB_PASSWORD: picped
    TEST_DB_NAME: picped_test
  before_script:
    - pip install -r requirements-dev.txt
    # espera o PostgreSQL aceitar conexões (até ~60 s)
    - |
      for i in $(seq 1 30); do
        python -c "import psycopg; psycopg.connect(host='postgres', user='postgres', password='picped', dbname='picped_test', connect_timeout=2).close()" && break
        echo "aguardando o PostgreSQL ($i)..."; sleep 2
      done
  script:
    - pytest -v --junitxml=report.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml

build-docker:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGEM: picped-api:$CI_COMMIT_SHORT_SHA
  script:
    - docker build --target runtime -t "$IMAGEM" .
    - docker image ls picped-api
    # a imagem final precisa rodar como usuário não-root (UID 10001)
    - test "$(docker run --rm --entrypoint id "$IMAGEM" -u)" = "10001"
    - docker run --rm --entrypoint python "$IMAGEM" -c "import app.main; print('import ok')"
